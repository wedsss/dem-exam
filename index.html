<script>
const lessons=[
['SQL','01','База, таблица, строка','База данных — набор связанных таблиц. Таблица похожа на лист: столбцы описывают свойства, строки — отдельные объекты. dbo — схема, то есть пространство имён. SELECT выбирает столбцы, FROM указывает таблицу. Звёздочка означает все столбцы. Точка с запятой завершает инструкцию.','SELECT * FROM dbo.Customers;','Напиши запрос, который показывает все столбцы таблицы Customers.','SELECT * FROM dbo.Customers;','Начни с SELECT, после FROM укажи dbo.Customers.'],
['SQL','01','Выбрать нужные столбцы','Имена столбцов перечисляют через запятую. Текст в SQL записывается в одинарных кавычках, но имена обычных столбцов в кавычки не заключают. CustomerName — название клиента, City — город.','SELECT CustomerName, City FROM dbo.Customers;','Выведи CustomerName и City из dbo.Customers в этом порядке.','SELECT CustomerName, City FROM dbo.Customers;','Между именами столбцов нужна запятая.'],
['SQL','01','Условие WHERE','WHERE оставляет только строки, подходящие условию. Знак = сравнивает. N перед строкой означает Unicode — подходит для русского текста в SQL Server.','SELECT * FROM dbo.Customers WHERE City = N\'Калуга\';','Покажи клиентов из города Калуга.','SELECT * FROM dbo.Customers WHERE City = N\'Калуга\';','WHERE City = N и текст в одинарных кавычках.'],
['SQL','01','Сортировка','ORDER BY задаёт порядок. ASC — по возрастанию, DESC — по убыванию. Сумма хранится числом decimal: числовая сортировка отличается от сортировки текста.','SELECT * FROM dbo.CustomerOrders ORDER BY TotalAmount DESC;','Покажи заказы по убыванию суммы.','SELECT * FROM dbo.CustomerOrders ORDER BY TotalAmount DESC;','ORDER BY ставится после FROM и WHERE.'],
['SQL','01','Количество и сумма','COUNT(*) считает строки, SUM складывает значения столбца. AS задаёт понятное имя результата. SUM для пустого набора даёт NULL: ISNULL заменяет его нулём.','SELECT COUNT(*) AS OrderCount, ISNULL(SUM(TotalAmount), 0) AS Total FROM dbo.CustomerOrders;','Заполни пропуск: функция подсчёта строк — ___(*). Введи только имя функции.','COUNT','Это не SUM: нужны строки, а не их сумма.'],
['SQL','04','Таблицы и ключи','CREATE TABLE создаёт таблицу. int — целое число; nvarchar(100) — текст до 100 символов. PRIMARY KEY однозначно определяет строку. IDENTITY автоматически выдаёт номера. NOT NULL запрещает отсутствие значения.','CREATE TABLE dbo.Products (\n ProductID int IDENTITY PRIMARY KEY,\n ProductName nvarchar(100) NOT NULL\n);','Какое сочетание слов делает столбец первичным ключом?','PRIMARY KEY','Первичный — PRIMARY.'],
['SQL','04','Связи и нормализация','Клиента храним один раз в Customers, а в заказе сохраняем его CustomerID. Внешний ключ REFERENCES не позволяет сослаться на отсутствующего клиента. Для 3НФ свойства клиента не копируют в каждый заказ.','CustomerID int NOT NULL REFERENCES dbo.Customers(CustomerID)','Какое ключевое слово задаёт ссылку на другую таблицу?','REFERENCES','Начинается на REF.'],
['SQL','04','Соединение JOIN','JOIN соединяет строки разных таблиц по условию ON. c и o — короткие псевдонимы. Один клиент может иметь много заказов. Соединение с позициями заказа размножит строки заказа: это важно при подсчёте суммы.','SELECT c.CustomerName, o.OrderDate\nFROM dbo.CustomerOrders AS o\nJOIN dbo.Customers AS c ON c.CustomerID = o.CustomerID;','Напиши условие соединения после ON, используя псевдонимы c и o.','c.CustomerID = o.CustomerID','Соединяем одинаковые ключи CustomerID.'],
['SQL','04','Добавление данных','INSERT INTO указывает таблицу и столбцы; VALUES — значения в том же порядке. Identity-ключ здесь не задаём. Для изменения строк есть UPDATE, для удаления DELETE. Перед ними всегда проверяй условие WHERE через SELECT.','INSERT INTO dbo.Products(ProductName) VALUES (N\'Панель\');','Добавь продукт Панель в dbo.Products, заполнив только ProductName.','INSERT INTO dbo.Products(ProductName) VALUES (N\'Панель\');','После списка столбцов нужно VALUES.'],
['SQL','01','Переменные и цикл','Переменная в T-SQL начинается с @. DECLARE объявляет, SET присваивает. WHILE повторяет блок BEGIN…END, пока условие истинно. Без увеличения счётчика цикл может стать бесконечным.','DECLARE @i int = 1;\nWHILE @i <= 10\nBEGIN\n PRINT @i;\n SET @i = @i + 1;\nEND;','Напиши строку увеличения @i на единицу через SET.','SET @i = @i + 1;','Новое значение равно старому плюс один.'],
['SQL','01','Пользователь и права','LOGIN существует на сервере, USER — внутри базы. CREATE DATABASE создаёт базу. GO разделяет пакеты в SSMS и не является командой T-SQL. В задании 1 каждому userN нужна своя BDN. Пароли генерируются, не копируй учебный пароль в реальную систему.','CREATE DATABASE BD1;\nGO\nUSE BD1;\nGO\nCREATE USER user1 FOR LOGIN user1;\nALTER ROLE db_datareader ADD MEMBER user1;','Назови команду переключения на базу BD1.','USE BD1;','Команда из трёх букв.'],
['SQL','02','Шифрование паролей','В вашем решении сертификат защищает симметричный ключ PasswordKey. Ключ открывают, EncryptByKey шифрует, DecryptByKey расшифровывает, затем ключ закрывают. Хеш нельзя расшифровать, поэтому он не заменяет требование задания 2.','UPDATE dbo.Users\nSET EncryptedPassword = EncryptByKey(Key_GUID(\'PasswordKey\'), Password);\n-- Выполняется после открытия ключа.','Какая функция расшифровывает данные при открытом ключе?','DecryptByKey','Encrypt — шифровать, Decrypt — расшифровать.'],
['SQL','03','Резервная копия','BACKUP DATABASE создаёт резервную копию, RESTORE DATABASE восстанавливает. Путь относится к компьютеру SQL Server. Службе SQL нужны права на папку. VERIFYONLY проверяет читаемость копии, но не заменяет пробное восстановление в отдельную базу.','BACKUP DATABASE BD TO DISK = N\'C:\\Backup\\BD_backup.bak\' WITH CHECKSUM;','Какое сочетание команд начинает создание резервной копии базы?','BACKUP DATABASE','Не RESTORE: нужно сохранить копию.'],
['SQL','05','Себестоимость','Стоимость материалов = количество × цена. Работа = норма времени × число операций × цена часа. Обе суммы считай отдельно: JOIN всех материалов со всеми операциями завысит итог. Ваш vw_ProductCost хранит расчёт единицы продукции.','SELECT SUM(pm.Quantity * m.PricePerUnit)\nFROM dbo.ProductMaterials pm\nJOIN dbo.Materials m ON m.MaterialID = pm.MaterialID\nWHERE pm.ProductID = 1;','2,5 кг по 85,50 руб. и 8 болтов по 5 руб. Какова стоимость материалов? Введи число с точкой.','253.75','2.5 × 85.5 + 8 × 5.'],
['SQL','05','Процедура с параметрами','Процедура — именованный набор SQL-команд. Параметры позволяют менять период без переписывания кода. BETWEEN включает обе границы. Для дат начала и конца нужно проверять, что начало не позже конца.','EXEC dbo.sp_OrderReportByPeriod \'20260601\', \'20260731\';','Какое слово запускает хранимую процедуру?','EXEC','Сокращение execute.'],
['SQL','05','Триггер','Триггер автоматически выполняется при изменении таблицы. inserted содержит новые строки, deleted — старые. Одна команда может затронуть много строк, поэтому расчёт должен обрабатывать набор заказов. В вашем решении триггер обновляет TotalAmount.','CREATE TRIGGER dbo.Example ON dbo.OrderItems\nAFTER INSERT, UPDATE, DELETE\nAS\nBEGIN\n SET NOCOUNT ON;\n -- Здесь пересчитывают затронутые заказы.\nEND;','Какая служебная таблица содержит удалённые строки?','deleted','Вторая таблица называется inserted.'],
['SQL','06','Архив и транзакция','Архивирование: скопировать заказы и позиции, затем удалить исходные позиции и заказы. BEGIN TRANSACTION объединяет шаги. COMMIT сохраняет, ROLLBACK отменяет. Условие по месяцу без года ошибочно захватит другие годы.','WHERE OrderDate >= \'20260601\' AND OrderDate < \'20260701\'','Какая команда отменяет транзакцию?','ROLLBACK','COMMIT делает обратное.'],
['C#','07','Переменные и типы','C# различает регистр: int и Int — разные имена. int — целое; decimal — точное десятичное; string — текст в двойных кавычках; bool — true/false. Точка с запятой завершает инструкцию. Суффикс m обозначает decimal.','int count = 3;\ndecimal total = 1250.50m;\nstring city = "Калуга";\nbool found = false;','Объяви целочисленную переменную count со значением 0.','int count = 0;','Сначала тип, затем имя, знак = и значение.'],
['C#','07','Условия if','if проверяет условие в круглых скобках. Блок команд заключают в фигурные скобки. = присваивает, == сравнивает. MessageBox.Show показывает окно с сообщением.','if (count == 0)\n{\n MessageBox.Show("Нет заказов");\n}','Введи оператор сравнения на равенство в C#.','==','Один знак = означает присваивание.'],
['C#','07','Цикл foreach','foreach перебирает элементы коллекции. В каждой итерации переменная row получает следующий элемент. += прибавляет к текущему значению. Convert.ToDecimal переводит значение из таблицы в decimal.','decimal total = 0;\nforeach (DataRowView row in ordersView)\n{\n total += Convert.ToDecimal(row["TotalAmount"]);\n}','Каким словом начинается цикл перебора коллекции?','foreach','Читается «для каждого».'],
['C#','07','Метод и событие','Метод — именованное действие. void означает, что он не возвращает результат. private ограничивает доступ классом. Нажатие кнопки вызывает событие Click: обработчик вызывает нужный метод.','private void FindCells()\n{\n // Поиск совпадений\n}\n// В конструкторе после InitializeComponent:\nfindButton.Click += (sender, args) => FindCells();','Какое слово означает, что метод не возвращает значение?','void','Не null: речь о типе результата метода.'],
['C#','07','Подключение к SQL','SqlConnection хранит подключение. Open открывает его. using гарантирует освобождение ресурса. Строка подключения задаёт сервер, базу и аутентификацию. Не включай реальные пароли в учебные ответы.','using (var connection = new SqlConnection(connectionString))\n{\n connection.Open();\n}','Напиши команду открытия соединения connection.','connection.Open();','Вызов метода требует круглых скобок.'],
['C#','07','Таблица на форме','SqlDataAdapter заполняет DataTable результатами запроса. DataGridView отображает источник DataSource. DefaultView даёт представление, которое умеет сортировать и фильтровать без изменения базы.','var table = new DataTable();\nadapter.Fill(table);\nordersGrid.DataSource = table.DefaultView;','Присвой table.DefaultView свойству DataSource элемента ordersGrid.','ordersGrid.DataSource = table.DefaultView;','Объект.Свойство = значение;'],
['C#','07','Сортировка и фильтр','DataView.Sort принимает имя столбца и направление. RowFilter задаёт условие отображения. Фильтруй по ключу CustomerID: названия могут повторяться и содержать кавычки. Эти действия не изменяют строки базы.','ordersView.Sort = "TotalAmount DESC";\nordersView.RowFilter = "CustomerID = 1";','Установи сортировку ordersView по TotalAmount по убыванию.','ordersView.Sort = "TotalAmount DESC";','Внутри строки нужен SQL-подобный порядок.'],
['C#','07','Поиск с подсветкой','По КИМу поиск выделяет совпавшие ячейки, а не удаляет строки. Перебери видимые ячейки, сравни отображаемый текст, установи цвет. Перед новым поиском сбрось старую подсветку.','cell.Style.BackColor = Color.Gold;','Задай ячейке cell золотой фон через Style.BackColor.','cell.Style.BackColor = Color.Gold;','Color.Gold — значение цвета.'],
['C#','07','Обработка ошибок','try содержит рискованное действие. catch обрабатывает исключение. finally выполняет завершающие действия. Покажи понятное сообщение: что произошло и как исправить. Нельзя оставлять catch пустым.','try\n{\n connection.Open();\n}\ncatch (Exception exception)\n{\n MessageBox.Show(exception.Message, "Ошибка подключения");\n}','Какое слово начинает блок обработки исключения?','catch','try пытается, catch перехватывает.'],
['C#','08','Проверка и руководство','Для задания 8 нужны реальные скриншоты приложения и порядок действий. Проверь подключение, оба направления сортировки, фильтр и сброс, поиск, пустую выборку, итоги и ошибки. Руководство пишется для пользователя, а не для программиста.','1. Выберите клиента.\n2. Нажмите «Фильтровать».\n3. Проверьте список и итоги.\n4. Нажмите «Показать все».','Какая кнопка снимает фильтр в форме из КИМа?','Показать все','Эта кнопка возвращает все заказы.']
];
let state={done:[],wrong:[],last:0};try{state=Object.assign(state,JSON.parse(localStorage.getItem('dem-progress')||'{}'))}catch{}
let current=0,examMode=false,examIds=[],examAt=0,examScore=0,start=0;
const main=document.getElementById('main'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('dem-progress',JSON.stringify(state))}catch{document.getElementById('notice').textContent='Браузер не сохраняет прогресс. Скачайте его кнопкой слева.'}}
function shell(html){main.innerHTML=html+'<p id="notice" role="status"></p><footer>По КИМу 09.02.07-1-2027 и вашей базе EnterpriseDB. Учебная проверка по эталону: SQL Server и C# здесь не исполняются. Полные программы проверяйте в SSMS и Visual Studio. Прогресс хранится только в этом браузере; для переноса скачайте его.</footer>'}
function home(){examMode=false;shell('<div class="tag">Спокойно. По одному шагу.</div><section class="hero"><div><h1>От первой строки<br>до своего приложения.</h1><p class="muted">SQL и C# могут казаться сложными. Начнём с маленьких понятных действий — и соберём из них задания демоэкзамена.</p><button class="primary" onclick="lesson(state.last)">Продолжить обучение →</button></div><div class="art"><span class="tag">Сегодня достаточно одного шага</span><code>SELECT знания<br>FROM практика<br>ORDER BY уверенность;</code><small>Прочитай. Попробуй. Разбери ошибку.</small></div></section><div class="panel"><div class="row"><b>Твой прогресс</b><span>'+state.done.length+' / '+lessons.length+' уроков</span></div><progress value="'+state.done.length+'" max="'+lessons.length+'"></progress><small>Это прогресс тренажёра, а не оценка готовности к экзамену.</small></div><h2>Три ступени к уверенности</h2><div class="cards"><div class="card"><span class="number">01</span><h3>Понять SQL</h3><p>Таблицы, запросы, связи, процедуры и защита данных.</p><button onclick="catalog(\'SQL\')">Начать с основ →</button></div><div class="card"><span class="number">02</span><h3>Собрать приложение</h3><p>Синтаксис C#, события и форма работы с заказами.</p><button onclick="catalog(\'C#\')">Перейти к C# →</button></div><div class="card"><span class="number">03</span><h3>Вспомнить самому</h3><p>Смешанные задания без подсказок и повторение ошибок.</p><button onclick="exam()">Проверить себя →</button></div></div>')}
function catalog(type){examMode=false;shell('<span class="tag">Учебный маршрут</span><h1>'+type+' с нуля</h1><p>Проходи по порядку. В каждом уроке — объяснение, пример и небольшое действие.</p><button onclick="memoryHub(&quot;cs&quot;)">Код по памяти · C#</button><div class="cards">'+lessons.map((l,i)=>l[0]===type?'<article class="card"><span class="badge">Задание '+l[1]+' · '+(state.done.includes(i)?'✓ пройдено':'5–10 минут')+'</span><h3>'+esc(l[2])+'</h3><button onclick="lesson('+i+')">Открыть урок →</button></article>':'').join('')+'</div>')}
function lesson(i){current=i;state.last=i;save();const l=lessons[i];shell('<div class="row"><span class="badge">'+l[0]+' · Задание '+l[1]+'</span><span class="muted">'+(examMode?'Проверка '+(examAt+1)+' / '+examIds.length:'Урок '+(i+1)+' / '+lessons.length)+'</span></div><h1>'+esc(l[2])+'</h1>'+(!examMode && l[0]==='C#'?'<button onclick="memoryHub(&quot;cs&quot;)">Код по памяти · C#</button>':'')+(!examMode?'<div class="panel"><h2>Разбираемся</h2><p>'+esc(l[3])+'</p><pre data-language="'+(l[0]==='C#'?'cs':'sql')+'">'+esc(l[4])+'</pre><small>Прочитай пример вслух: что делает каждая часть?</small></div>':'')+'<div class="panel"><h2>Теперь твоя очередь</h2><p>'+esc(l[5])+'</p><label for="answer">Твой ответ</label><textarea data-language="'+(l[0]==='C#'?'cs':'sql')+'" id="answer" spellcheck="false" placeholder="Напиши ответ здесь…"></textarea><div class="row"><button class="primary" onclick="check()">Проверить ответ</button>'+(!examMode?'<button onclick="hint()">Подсказка</button>':'')+'</div><div id="feedback" role="status"></div>'+(!examMode?'<details><summary>Разобрать эталон</summary><pre data-language="'+(l[0]==='C#'?'cs':'sql')+'">'+esc(l[6])+'</pre><p>'+esc(l[7])+'</p><small>Закрой ответ и набери его по памяти. В экзамене подсказок не будет.</small></details>':'')+'</div><div class="row">'+(!examMode?'<button onclick="lesson(Math.max(0,current-1))">← Назад</button><button onclick="lesson(Math.min(lessons.length-1,current+1))">Следующий урок →</button>':'')+'</div>')}
function norm(s,sql){let parts=s.trim().replace(/;$/,'').match(/N?'(?:''|[^'])*'|"(?:\\.|[^"])*"|[A-Za-z_][A-Za-z_0-9]*|\S/g)||[];return parts.map(x=>sql&&!/^N?'/.test(x)?x.toLowerCase():x).join('')}
function check(){const value=document.getElementById('answer').value;if(!value.trim()){document.getElementById('feedback').innerHTML='<p class="feedback">Сначала напиши ответ. Даже одна попытка полезнее пустого поля.</p>';return}let l=lessons[current],ok=norm(value,l[0]==='SQL')===norm(l[6],l[0]==='SQL');if(ok){if(!state.done.includes(current))state.done.push(current);state.wrong=state.wrong.filter(x=>x!==current)}else if(!state.wrong.includes(current))state.wrong.push(current);save();document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'ok':'')+'">'+(ok?'✓ Верно! '+esc(l[7]):'Пока не совпало с учебным эталоном. '+esc(l[7])+' Проверь имена, кавычки и знаки. Другие корректные способы могут не распознаваться этой проверкой.')+'</div>';if(examMode){if(ok)examScore++;document.querySelector('button.primary').disabled=true;document.getElementById('feedback').innerHTML+='<button onclick="nextExam()">Следующее задание →</button>'}}
function hint(){document.getElementById('feedback').innerHTML='<p class="feedback">'+esc(lessons[current][7])+'</p>'}
function review(){examMode=false;shell('<h1>Ошибки — это маршрут.</h1><p>Вернись к этим темам. После правильного ответа урок исчезнет из списка.</p>'+(!state.wrong.length?'<div class="panel">Пока нет ошибок для повторения. Продолжай обучение или проверь себя.</div>':state.wrong.map(i=>'<div class="panel"><h3>'+esc(lessons[i][2])+'</h3><button onclick="lesson('+i+')">Повторить →</button></div>').join('')))}
function exam(){examMode=true;examIds=lessons.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,10);examAt=0;examScore=0;start=Date.now();lesson(examIds[0])}
function nextExam(){examAt++;if(examAt<examIds.length)lesson(examIds[examAt]);else{examMode=false;shell('<span class="tag">Мини-проверка завершена</span><h1>'+examScore+' из 10</h1><p>Время: '+Math.ceil((Date.now()-start)/60000)+' мин. Это проверка отдельных навыков, не полный демоэкзамен.</p><button onclick="review()">Разобрать ошибки</button><button onclick="guide()">Практика полного задания</button>')}}
function guide(){examMode=false;shell('<h1>От уроков к экзамену.</h1><p>На каждую неделю: 5 коротких занятий и одна самостоятельная практика. Если трудно — повтори неделю.</p>'+['1–2 · Основа SQL|Пройди выборку, условия, сортировку, итоги и связи. В SSMS напиши каждый запрос по памяти и проверь результат на EnterpriseDB.','3 · Задания 1–3|Разбери цикл создания user1…user10 и BD1…BD10 в своём SQL-файле. Проверь изоляцию доступа. Выполни шифрование и расшифровку, создай копию и восстанови в отдельную учебную базу. Не перезаписывай рабочую базу.','4 · Задания 4–6|Нарисуй связи таблиц. Объясни первичные и внешние ключи. Рассчитай себестоимость вручную и сравни с представлением. Проверь триггер на нескольких строках, процедуру на пустом периоде, архивирование с откатом.','5 · Основы C#|Пройди типы, условия, циклы, методы и исключения. Набери примеры в отдельном учебном проекте, намеренно допусти ошибку и прочитай сообщение компилятора.','6 · Задание 7|Открой OrdersApp.sln. Создай форму заново: DataGridView, список клиента, поиск, кнопки и переключатели. Добавляй по одной функции. Имена сервера и база задаются в App.config.','7 · Проверка и руководство|Проверь обе сортировки, клиента без заказов, поиск без совпадений, сброс фильтра, итоги и неверный сервер. Сделай реальные скриншоты и опиши действия пользователя для задания 8.','8 · Репетиция|Выполни весь вариант на чистой учебной базе без подсказок. По КИМу БУ ориентир — 3 ч 30 мин, задание 7 — 40 мин, задание 8 — 10 мин. Сверь окончательный регламент своего колледжа.'].map(s=>{let [a,b]=s.split('|');return '<section class="panel"><h2>'+a+'</h2><p>'+b+'</p></section>'}).join('')+'<h2>Что считать готовностью</h2><p>Ты можешь объяснить код своими словами, написать его без копирования, изменить условие и найти ошибку. Один правильный ответ в тренажёре этого ещё не доказывает.</p>')}
function exportProgress(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='dem-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importProgress(input){try{let s=JSON.parse(await input.files[0].text());if(!Array.isArray(s.done)||!Array.isArray(s.wrong)||![...s.done,...s.wrong].every(i=>Number.isInteger(i)&&i>=0&&i<lessons.length))throw Error();state={done:[...new Set(s.done)],wrong:[...new Set(s.wrong)],last:Number.isInteger(s.last)&&s.last>=0&&s.last<lessons.length?s.last:0};save();home()}catch{alert('Не удалось прочитать прогресс. Выберите JSON, скачанный из этого тренажёра.')}}
home();
</script><script src="kim-data.js"></script><script src="sql-course.js"></script><script src="exam.js"></script><script src="exam-review.js"></script><script src="syntax-colours.js"></script><script src="join-practice.js"></script><script src="memory.js"></script></html>
